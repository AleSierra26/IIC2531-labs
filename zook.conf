[main]
    cmd = zookd2
    dir = /home/student/
    lxcbr = 0
    port = 8080
    http_svcs = dynamic,static

[dynamic]
    cmd = zookfs
    url = ^/zoobar/index\.cgi
    dir = /home/student/
    lxcbr = 1
    port = 8081

[static]
    cmd = zookfs
    url = ^(?!/zoobar/index\.cgi).*$ 
    dir = /home/student/
    lxcbr = 2
    port = 8081

[echo]
    cmd = /zoobar/echo-server.py
    dir = /home/student
    lxcbr = 9
    port = 8081
