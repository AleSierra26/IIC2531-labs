[main]
    cmd = zookd2
    dir = /home/student/
    lxcbr = 0
    port = 8080
    http_svcs = dynamic,static

[dynamic]
    cmd = zookfs
    url = ^/zoobar/index\.cgi(/.*)?$
    dir = /home/student/
    lxcbr = 1
    port = 8081
    fwrule = -m state --state ESTABLISHED,RELATED -j ACCEPT
    fwrule = -s main -j ACCEPT
    fwrule = -j REJECT

[static]
    cmd = zookfs
    url = .*\.(html|css|js|png|jpg|gif|txt|ico)
    dir = /home/student/
    lxcbr = 2
    port = 8081
    fwrule = -m state --state ESTABLISHED,RELATED -j ACCEPT
    fwrule = -s main -j ACCEPT
    fwrule = -j REJECT

[auth]
    cmd = /zoobar/auth-server.py
    dir = /home/student/
    lxcbr = 3
    port = 8081
    fwrule = -m state --state ESTABLISHED,RELATED -j ACCEPT
    fwrule = -s dynamic -j ACCEPT
    fwrule = -j REJECT

[bank]
    cmd = /zoobar/bank_server.py
    dir = /home/student/
    lxcbr = 4
    port = 8081
    fwrule = -m state --state ESTABLISHED,RELATED -j ACCEPT
    fwrule = -s dynamic -j ACCEPT    
    fwrule = -s auth -j ACCEPT
    fwrule = -j REJECT


[echo]
    cmd = /zoobar/echo-server.py
    dir = /home/student
    lxcbr = 9
    port = 8081


